{% extends "base.html" %}

{% block title %}{{ _('2FA Login - Telescope Control') }}{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1 class="text-center">{{ _('2FA Login') }}</h1>
    
    
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <div class="mb-3">
            <label for="totp" class="form-label">{{ _('2FA Code') }}</label>
            <input type="text" name="totp" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">{{ _('Submit') }}</button>
    </form>
</div>
{% endblock %}
