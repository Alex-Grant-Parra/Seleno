{% extends "base.html" %}

{% block content %}

    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="card shadow">
                <div class="card-body">
                    <h1 class="display-4 text-warning"><i class="fas fa-hard-hat"></i></h1>
                    <h2 class="card-title">{{ _("Under Construction") }}</h2>

                    <div class="mt-4">
                        <a href="{{ url_for('home.home') }}" class="btn btn-primary">

                </div>
            </div>
        </div>
    </div>
</div>
