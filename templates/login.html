{% extends "base.html" %}

{% block title %}{{ _('Login - Telescope Control') }}{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1 class="text-center">{{ _('Login') }}</h1>
    
    
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <div class="mb-3">
            <label for="username" class="form-label">{{ _('Username') }}</label>
            <input type="text" name="username" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">{{ _('Password') }}</label>
            <input type="password" name="password" class="form-control" required>
        </div>

        <div class="mb-3 form-check">
            <input type="checkbox" name="trust_device" class="form-check-input" id="trust_device">
            <label class="form-check-label" for="trust_device">
                {{ _('Trust this device for 30 days (skip 2FA)') }}
            </label>
            <small class="form-text text-muted">
                {{ _('Only check this on your personal devices. This will remember this device and skip 2FA for 30 days.') }}
            </small>
        </div>

        <button type="submit" class="btn btn-primary w-100">{{ _('Login') }}</button>
    </form>

    <!-- Forgot Password Link -->
    <div class="mt-3 text-center">
        <a href="{{ url_for('auth.forgot_password') }}">{{ _('Forgot your password?') }}</a>
    </div>
</div>
{% endblock %}
