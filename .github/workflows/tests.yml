name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      - name: Client tests
        run: python -m unittest discover -s tests -t .
      - name: Panel and serial link tests
        run: python -m unittest esp32.tests.test_panel_ui esp32.tests.test_interface_pty

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - run: pio run -d esp32-firmware -e seleno_v08 -e devkit
