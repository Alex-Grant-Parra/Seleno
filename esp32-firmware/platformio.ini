; SELENO v0.8 controller firmware.
; Hardware reference: ../SELENO Controller v0.8 Hardware Report.txt
;
;   seleno_v08  the real board (default)
;   devkit      bare ESP32 dev kit: motion allowed without TMC drivers,
;               plus a second host UART on IO26 (RX) / IO25 (TX) so the
;               Pi's GPIO UART can be tested over jumpers while USB is
;               connected. For exercising the Pi stack before the board.
;   native      host-side unit tests for the pure logic in src/logic/
;               (pio test -e native)

[platformio]
default_envs = seleno_v08

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600
upload_speed = 921600
; The host link is UART0, so keep ESP-IDF log lines out of the JSON stream.
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -Wall
lib_deps =
  teemuatlut/TMCStepper@^0.7.3
  bblanchon/ArduinoJson@^7.2.1
  lovyan03/LovyanGFX@^1.2.7
  adafruit/Adafruit BNO08x@^1.2.5
test_ignore = *

[env:seleno_v08]

[env:devkit]
build_flags =
  ${env.build_flags}
  -DSELENO_DEVKIT=1
  -DSELENO_AUX_HOST_UART=1

[env:native]
platform = native
framework =
board =
lib_deps =
build_flags = -std=c++17 -Isrc
test_ignore =
test_build_src = no
